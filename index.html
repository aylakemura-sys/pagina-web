<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header {
            background-color: #f8a5c2;
            color: #ffffff;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            border: 5px solid #fa83ad;

        }

        main {
            background-color: #f8a5c2;
            color: #ffffff;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
        }

        img {
            width: 100px;
            height: 80px;
        }

        .artigo-autor {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <h1>Lendas da dança</h1>
        <p>As 5 Maiores Bailarinas do Mundo</p>
    </header>
    <main>
        <div>
            <img src="bailarinas.png"
                alt="Plano detalhado das pernas de várias bailarinas enfileiradas, vestindo tutus brancos e sapatilhas de ponta, em posicao de danca sobre o palco.">
        </div>
        <div>
            <p class="artigo-autor"> Por: Ayla Yuna Kemura </p>
            <p> Sejam bem-vindos. Neste artigo, apresentaremos as cinco bailarinas de maior destaque no cenário da dança
                mundial. </p>
            <button> 👍 <span>0</span></button>
            <button> 👎 <span>0</span></button>
        </div>

    </main>
</body>
<script>

    const botoes = document.querySelectorAll("button");



    botoes.forEach(function (botao)
    {

        botao.addEventListener("click", botaoClicado);



        function botaoClicado() {

            console.log("fui clicado");

            let texto = botao.querySelector("span");

            texto.textContent++;
        }
    }
    )
</script>


</html>
